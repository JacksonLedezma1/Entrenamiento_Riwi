<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz Interactiva con Persistencia de Datos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Interfaz Interactiva con Persistencia de Datos</h1>
    <form id="userForm">
        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="age">Edad:</label>
            <input type="number" id="age" name="age" required min="1" max="120">
        </div>
        <div class="feedback" id="feedback"></div>
        <button type="submit">Guardar</button>
        <button type="button" id="clearBtn">Limpiar Datos</button>
    </form>
    <div class="data-box" id="storedData"></div>
    <div class="data-box" id="interactionCount"></div>

    <script src="script.js"></script>
</body>
</html>
